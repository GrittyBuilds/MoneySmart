<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="MoneySmart — a simple family budgeting web app." />
    <title>MoneySmart — Family Budgeting</title>
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong colors. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('moneysmart.settings') || '{}')
          var t = s.theme || 'system'
          if (t === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"><!-- app renders here --></div>

    <!-- Core (order matters — plain scripts, no bundler) -->
    <script src="js/util.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/store.js"></script>
    <script src="js/backend-local.js"></script>
    <script src="js/backend-cloud.js"></script>
    <script src="js/router.js"></script>

    <!-- Pages -->
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/transactions.js"></script>
    <script src="js/pages/budgets.js"></script>
    <script src="js/pages/reports.js"></script>
    <script src="js/pages/accounts.js"></script>
    <script src="js/pages/family.js"></script>
    <script src="js/pages/settings.js"></script>

    <!-- Bootstrap (last) -->
    <script src="js/app.js"></script>
  </body>
</html>
